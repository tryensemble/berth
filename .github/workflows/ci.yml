name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: Lint and unit tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test

  e2e:
    name: End-to-end
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-musl
      - uses: Swatinem/rust-cache@v2
      - name: Install build and runtime dependencies
        run: sudo apt-get update -qq && sudo apt-get install -y -qq musl-tools nftables
      - name: Build the static binary
        run: make build
      - name: Install and start berthd
        run: |
          sudo make install
          sudo usermod -aG berth "$USER"
          sudo systemctl daemon-reload
          sudo systemctl start berthd
          timeout 30 sh -c 'until [ -S /run/berth/berth.sock ]; do sleep 0.2; done'
          sudo berth pull ubuntu:24.04
      - name: Run the end-to-end tests
        run: make e2e
      - name: Daemon log
        if: failure()
        run: sudo journalctl -u berthd --no-pager
      - uses: actions/upload-artifact@v4
        with:
          name: berth-x86_64-linux-musl
          path: target/x86_64-unknown-linux-musl/release/berth
