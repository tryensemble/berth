[package]
name = "berth"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "MIT OR Apache-2.0"
description = "Light, isolated boxes for AI agent threads on one Linux machine"
repository = "https://github.com/tryensemble/berth"
readme = "README.md"
keywords = ["sandbox", "isolation", "containers", "agents", "linux"]
categories = ["command-line-utilities", "os::linux-apis", "virtualization"]
publish = false

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
flate2 = "1"
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tar = "0.4"
ureq = { version = "2", features = ["json"] }

[dev-dependencies]
tempfile = "3"

[profile.release]
strip = true
lto = true
codegen-units = 1

[lints.rust]
unsafe_op_in_unsafe_fn = "warn"

[lints.clippy]
dbg_macro = "warn"
todo = "warn"
